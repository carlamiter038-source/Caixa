<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PDV - Caixa Livre</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; background: #004080; color: white; padding: 10px; border-radius: 4px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .total-box { font-size: 24px; font-weight: bold; color: #008000; margin-top: 20px; text-align: right; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 10px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>CAIXA LIVRE - PDV</h1>
    
    <div class="form-group">
        <label for="produto">Selecione o Produto:</label>
        <select id="produto" onchange="atualizarPreco()">
            <option value="23.90" data-nome="Papel Sulfite A4">Papel Sulfite A4 - R$ 23,90</option>
            <option value="15.50" data-nome="Caneta Azul CX">Caneta Azul CX - R$ 15,50</option>
            <option value="45.00" data-nome="Cartucho de Tinta">Cartucho de Tinta - R$ 45,00</option>
        </select>
    </div>

    <div class="form-group">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" value="1" min="1" oninput="calcularTotal()">
    </div>

    <div class="total-box" id="lblTotal">
        Total: R$ 23,90
    </div>

    <button onclick="finalizarVenda()">Finalizar Venda / Emitir Cupom</button>
</div>

<script>
    function calcularTotal() {
        let preco = parseFloat(document.getElementById('produto').value);
        let qtd = parseInt(document.getElementById('quantidade').value) || 0;
        let total = preco * qtd;
        document.getElementById('lblTotal').innerText = "Total: R$ " + total.toFixed(2).replace('.', ',');
    }

    function atualizarPreco() {
        calcularTotal();
    }

    function finalizarVenda() {
        alert("Venda finalizada com sucesso! (Para emitir o SAT real, seria necessário integrar com a API local do equipamento).");
    }
</script>

</body>
</html>
