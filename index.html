<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PDV - Caixa Livre</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; background: #004080; color: white; padding: 10px; border-radius: 4px; margin-top: 0; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #f2f2f2; }
        
        .total-box { font-size: 22px; font-weight: bold; color: #008000; margin-top: 15px; text-align: right; background: #e8f5e9; padding: 10px; border-radius: 4px; }
        
        button { background: #28a745; color: white; border: none; padding: 12px; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 10px; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h1>CAIXA LIVRE - PDV</h1>
    
    <div class="grid">
        <!-- Lado Esquerdo: Lançamento de Itens -->
        <div>
            <h3>Lançar Produto</h3>
            <div class="form-group">
                <label for="produto">Produto:</label>
                <select id="produto" onchange="atualizarUnitario()">
                    <option value="23.90" data-nome="Papel Sulfite A4">Papel Sulfite A4 - R$ 23,90</option>
                    <option value="4.50" data-nome="Caneta Esferográfica">Caneta Esferográfica - R$ 4,50</option>
                    <option value="12.00" data-nome="Caderno 96 Fls">Caderno 96 Fls - R$ 12,00</option>
                </select>
            </div>

            <div class="form-group">
                <label for="valorUnitario">Valor Unitário (R$):</label>
                <input type="text" id="valorUnitario" value="23.90" disabled>
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" value="1" min="1">
            </div>

            <button onclick="adicionarItem()">Adicionar ao Carrinho</button>
        </div>

        <!-- Lado Direito: Carrinho / Tabela de Vendas -->
        <div>
            <h3>Itens do Cupom</h3>
            <div style="max-height: 200px; overflow-y: auto;">
                <table id="tabelaCarrinho">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Os itens entram aqui dinamicamente -->
                    </tbody>
                </table>
            </div>

            <div class="total-box" id="lblTotalGeral">
                Total: R$ 0,00
            </div>

            <button onclick="finalizarVenda()">Finalizar Venda / Emitir NFC-e</button>
        </div>
    </div>
</div>

<script>
    let carrinho = [];

    function atualizarUnitario() {
        let select = document.getElementById('produto');
        let preco = select.value;
        document.getElementById('valorUnitario').value = preco;
    }

    function adicionarItem() {
        let select = document.getElementById('produto');
        let nomeProduto = select.options[select.selectedIndex].getAttribute('data-nome');
        let precoUnitario = parseFloat(select.value);
        let quantidade = parseInt(document.getElementById('quantidade').value);

        if (quantidade <= 0 || isNaN(quantidade)) {
            alert("Informe uma quantidade válida!");
            return;
        }

        let totalItem = precoUnitario * quantidade;

        // Adiciona à lista do carrinho
        carrinho.push({ nome: nomeProduto, qtd: quantidade, total: totalItem });
        
        atualizarTabela();
    }

    function atualizarTabela() {
        let tbody = document.querySelector('#tabelaCarrinho tbody');
        tbody.innerHTML = '';
        let totalGeral = 0;

        carrinho.forEach(item => {
            totalGeral += item.total;
            let linha = `<tr>
                <td>${item.nome}</td>
                <td>${item.qtd}</td>
                <td>R$ ${item.total.toFixed(2).replace('.', ',')}</td>
            </tr>`;
            tbody.innerHTML += linha;
        });

        document.getElementById('lblTotalGeral').innerText = "Total: R$ " + totalGeral.toFixed(2).replace('.', ',');
    }

    function finalizarVenda() {
        if (carrinho.length === 0) {
            alert("O carrinho está vazio!");
            return;
        }
        alert("Venda finalizada com sucesso! Arquivo XML gerado para envio.");
        carrinho = [];
        atualizarTabela();
    }
</script>

</body>
</html>
